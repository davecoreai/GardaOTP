<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Masuk — Garda OTP</title>
  <meta name="description" content="Masuk atau daftar akun Garda OTP untuk memesan nomor virtual dan memantau kode verifikasi OTP secara real-time.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/gardaotp-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/gardaotp-icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="grain"></div>
<div id="authScreen" class="auth-wrap">
  <button class="auth-back" id="authBack" type="button"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Kembali ke halaman utama</button>
  <div class="auth-card">
    <div class="brand"><img src="/assets/gardaotp-mark.png" alt="Garda OTP"><span>Garda <span>OTP</span></span></div>
    <h1 id="authTitle">Masuk ke akun</h1>
    <p class="muted" id="authSubtitle">Masuk untuk melanjutkan ke dashboard Garda OTP.</p>
    <button class="google-btn" id="googleLogin" type="button"><img src="/assets/google-g.svg" alt="">Login Dengan Google</button>
    <div class="auth-divider"><span>atau dengan email</span></div>
    <form id="authForm">
      <label id="nameField" class="hidden">Nama<input id="authName" autocomplete="name" placeholder="Nama lengkap"></label>
      <label id="usernameField" class="hidden">Username<input id="authUsername" autocomplete="username" placeholder="username" minlength="3" maxlength="20" pattern="[a-z0-9]+"><small>Huruf kecil dan angka saja, 3–20 karakter.</small></label>
      <label>Email<input id="authEmail" type="email" required autocomplete="email" placeholder="nama@email.com"></label>
      <label>Password<input id="authPassword" type="password" required minlength="8" autocomplete="current-password" placeholder="Minimal 8 karakter"><div id="passwordMeter" class="password-meter hidden"><div><span id="passwordStrength"></span></div><small id="passwordHint">Kekuatan password</small></div></label>
      <button class="primary-btn full" type="submit" id="authSubmit">Masuk</button>
    </form>
    <section id="emailOtpPanel" class="hidden">
      <h2>Verifikasi email</h2>
      <p class="muted">Masukkan kode 6 digit yang dikirim ke email kamu.</p>
      <div class="otp-inputs" id="otpInputs"><input inputmode="numeric" maxlength="1" aria-label="Digit 1"><input inputmode="numeric" maxlength="1" aria-label="Digit 2"><input inputmode="numeric" maxlength="1" aria-label="Digit 3"><input inputmode="numeric" maxlength="1" aria-label="Digit 4"><input inputmode="numeric" maxlength="1" aria-label="Digit 5"><input inputmode="numeric" maxlength="1" aria-label="Digit 6"></div>
      <button class="primary-btn full" id="verifyOtp" type="button">Verifikasi akun</button>
      <button class="text-btn" id="resendOtp" type="button">Kirim ulang kode</button>
    </section>
    <button class="text-btn" id="authToggle">Belum punya akun? Daftar</button>
  </div>
</div>
<script type="module" src="/login.js"></script>
</body>
</html>
